{% extends "base.html" %}
{% block title %}Post an item{% endblock %}
{% block main %}
<div class="post-page">
  <h1>Post an item</h1>
  <p>Fill out our details of item found.</p>

  {% if error %}
  <p class="form-error">{{ error }}</p>
  {% endif %}

  <form action="{{ url_for('create_post') }}" method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="photo">Photo</label>
      <img src="https://picsum.photos/400/300" alt="">
      <input type="file" id="photo" name="photo" accept="image/*" required>
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Black AirPods case"
             value="{{ form.title if form }}" required>
    </div>

    <div class="field">
      <label for="building">Lost &amp; Found location</label>
      <select id="building" name="building" required>
        <option value="">Choose building...</option>
        {% for b in buildings %}
        <option value="{{ b.location_id }}"
          {% if form and form.building == b.location_id|string %}selected{% endif %}>{{ b.building_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="item_type">Item type</label>
      <select id="item_type" name="item_type" required>
        <option value="">Choose type...</option>
        {% for t in item_types %}
        <option value="{{ t.item_id }}"
          {% if form and form.item_type == t.item_id|string %}selected{% endif %}>{{ t.item_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="details">More details (optional)</label>
      <textarea id="details" name="details" rows="4" placeholder="Some color Item. Found at some location">{{ form.details if form }}</textarea>
    </div>

    <div>
      <h2>Drop off at Loft and Found</h2>
      <p>The Lost &amp; Found for [selected building] is at [location].</p>
    </div>

    <button type="submit" class="btn-accent">Post item</button>
    <a href="{{ url_for('index') }}">Cancel</a>
  </form>
</div>
{% endblock %}

[project]
name = "developing-the-interactive-web-project-1-group-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ray Amberg", email = "amber079@umn.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "clip",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "torch>=2.14.1",
    "authlib>=1.8.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "pillow-heif>=1.8.1",
    "mobileclip>=0.0.1",
    "open-clip-torch>=3.3.0",
]

[project.scripts]
developing-the-interactive-web-project-1-group-1 = "developing_the_interactive_web_project_1_group_1:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
